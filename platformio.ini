; PlatformIO Project Configuration File
; ESP32 iNFINITEAi2025 — production-readiness repair baseline

[platformio]
default_envs = native

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -Wall
    -Wextra
    -Wformat
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
    esphome/AsyncTCP @ *
    esp32async/ESPAsyncWebServer @ ^3.7
    h2zero/NimBLE-Arduino @ ^1.4
    plerup/EspSoftwareSerial @ ^8.1
board_build.partitions = min_spiffs.csv
upload_protocol = espota
upload_port = infiniteai.local

[env:esp32dev_serial]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -Wformat
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
    esphome/AsyncTCP @ *
    esp32async/ESPAsyncWebServer @ ^3.7
    h2zero/NimBLE-Arduino @ ^1.4
    plerup/EspSoftwareSerial @ ^8.1
board_build.partitions = min_spiffs.csv

[env:native]
platform = native
build_flags =
    -DNATIVE_TEST
    -DAPI_AUTH_TOKEN=\"test-api-token\"
    -DMQTT_COMMAND_TOKEN=\"test-mqtt-token\"
    -DOTA_PASSWORD_HASH=\"0123456789abcdef0123456789abcdef\"
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Isrc
test_framework = unity
test_build_src = yes
