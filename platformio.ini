; PlatformIO Project Configuration File
; ESP32 iNFINITEAi2025 — Cloud-connected, AI-controlled, Flipper Zero + Mobile integrated
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

; Library dependencies
lib_deps =
    knolleary/PubSubClient @ ^2.8          ; MQTT client
    bblanchon/ArduinoJson @ ^7.0           ; JSON serialisation
    esphome/AsyncTCP @ *                   ; Async TCP base
    esp32async/ESPAsyncWebServer @ ^3.7    ; Async HTTP server for mobile API
    h2zero/NimBLE-Arduino @ ^1.4           ; BLE (Flipper Zero + mobile)
    plerup/EspSoftwareSerial @ ^8.1        ; Software serial (Flipper UART)
    Wire                                   ; I2C

; Partition scheme — needs OTA + extra app space for sandbox
board_build.partitions = min_spiffs.csv

; Over-the-air update support
upload_protocol = espota
upload_port = infiniteai.local

; Fallback serial upload
[env:esp32dev_serial]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
    esphome/AsyncTCP @ *
    esp32async/ESPAsyncWebServer @ ^3.7
    h2zero/NimBLE-Arduino @ ^1.4
    plerup/EspSoftwareSerial @ ^8.1
    Wire
board_build.partitions = min_spiffs.csv

[env:native]
platform = native
build_flags =
    -DNATIVE_TEST
    -std=c++17
test_framework = unity
