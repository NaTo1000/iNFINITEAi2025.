name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Check ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32dev_serial, native]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Parse project configuration
        run: pio project config
      - name: Resolve environment dependencies
        run: pio pkg install -e ${{ matrix.environment }}
      - name: List resolved dependencies
        run: pio pkg list -e ${{ matrix.environment }}
      - name: Build firmware
        if: matrix.environment != 'native'
        run: pio run -e ${{ matrix.environment }}
      - name: Run native tests
        if: matrix.environment == 'native'
        run: pio test -e native
